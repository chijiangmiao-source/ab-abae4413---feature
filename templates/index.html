<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>低温探测器标定谱系</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>低温探测器标定谱系</h1>
  <p class="sub">原始读数 · 推导标定 · 级联失效裁决（编号与失效状态经真实接口持久化）</p>
</header>

<main>
  <section class="card">
    <h2>建立标定记录</h2>
    <form id="create-form">
      <div class="row">
        <label>类型
          <select id="kind" name="kind">
            <option value="raw">原始记录（传感器原始读数）</option>
            <option value="derived">推导记录（依赖一个或多个前序记录）</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label>读数 / 结论内容
          <input id="value" type="text" placeholder="例如 detector-A @ 77K = 12.4 mV" required>
        </label>
      </div>
      <div class="row" id="parents-row" hidden>
        <fieldset>
          <legend>直接依据（仅当前有效的记录，可多选）</legend>
          <div id="parents" class="parents"></div>
        </fieldset>
      </div>
      <button type="submit">提交记录</button>
    </form>
  </section>

  <section class="card">
    <h2>失效裁决</h2>
    <form id="invalidate-form" class="inline-form">
      <label>目标记录编号
        <input id="inv-target" type="text" placeholder="R000001" required>
      </label>
      <label>操作标识（幂等键）
        <input id="inv-op" type="text" placeholder="例如 op-20260925-001" required>
      </label>
      <button type="submit" class="danger">发起失效裁决</button>
    </form>
  </section>

  <section class="card">
    <h2>替代重建</h2>
    <p class="sub" style="margin:0 0 .6rem">
      有效原始读数失真时，以替代读数重建该记录及全部可达的有效推导：
      副本保留原结论，已重建依据指向新编号，其余依据不变；旧根与旧下游在同一事务内失效。
    </p>
    <form id="rebuild-form" class="inline-form">
      <label>目标原始记录编号
        <input id="rb-target" type="text" placeholder="R000001（须为有效原始记录）" required>
      </label>
      <label>替代读数内容
        <input id="rb-value" type="text" placeholder="例如 detector-A @ 77K = 12.1 mV（修正值）" required>
      </label>
      <label>修复操作标识（幂等键）
        <input id="rb-op" type="text" placeholder="例如 fix-20260925-001" required>
      </label>
      <button type="submit">发起替代重建</button>
    </form>
  </section>

  <section class="card">
    <h2>记录谱系 <button id="refresh" type="button" class="linklike">刷新</button></h2>
    <div class="legend">
      <span><i class="dot valid"></i>新支 / 有效</span>
      <span><i class="dot invalid"></i>旧支 / 已失效</span>
      <span class="muted">重建映射在记录卡上以「旧编号 → 新编号」标注</span>
    </div>
    <div id="records" class="records"></div>
  </section>

  <section class="card">
    <h2>重建映射（新旧两支谱系）</h2>
    <div id="mappings" class="mappings"><p class="muted">尚未发起替代重建。</p></div>
  </section>

  <section class="card">
    <h2>最近一次操作结果</h2>
    <pre id="feedback" class="feedback muted">尚无操作</pre>
  </section>
</main>

<script src="/static/app.js"></script>
</body>
</html>
